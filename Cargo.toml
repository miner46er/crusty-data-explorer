[package]
name = "crusty-data-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "crusty_data_explorer"
path = "src/lib.rs"

[[bin]]
name = "crusty-data-explorer"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui_extras = "0.36"
rfd = "0.15"
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "mysql"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
ssh2 = { version = "0.9", optional = true }
# XLSX support. zip 8.x is fully yanked upstream (9.0.3 is the only live
# version) and every xlsx crate still requires ^8, so Cargo.lock pins the
# checksum-verified zip 8.6.0 registry release by hand. Do not run
# `cargo update` until calamine or rust_xlsxwriter accept zip 9; re-resolving
# fails. Migrate when upstream ships zip 9 support.
calamine = "0.36"
rust_xlsxwriter = "0.99"

[features]
default = []
postgres = ["dep:sqlx", "dep:tokio"]
mysql = ["dep:sqlx", "dep:tokio"]
ssh = ["dep:ssh2"]
