[package]
name = "crusty-data-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "crusty_data_explorer"
path = "src/lib.rs"

[[bin]]
name = "crusty-data-explorer"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui_extras = "0.36"
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
default = []
postgres = ["dep:sqlx", "dep:tokio"]
